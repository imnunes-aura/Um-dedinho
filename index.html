<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bichinhos Dedos v6</title></head><body style="background:#111;color:white;text-align:center;font-family:Arial"><h3>1=🪱 2=🐰 3=🐱 4=🦋 5=🦁</h3><video id=v width=960 height=720 autoplay playsinline muted style="transform:scaleX(-1)"></video><canvas id=c width=960 height=720 style="position:absolute;left:50%;transform:translateX(-50%);pointer-events:none"></canvas><script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0"></script><script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/hand-pose-detection"></script><script>const ctx=c.getContext('2d');function count(k){let f=0;if(k[8].y<k[6].y)f++;if(k[12].y<k[10].y)f++;if(k[16].y<k[14].y)f++;if(k[20].y<k[18].y)f++;const thumbReach=Math.hypot(k[4].x-k[5].x,k[4].y-k[5].y);const thumbFold=Math.hypot(k[2].x-k[5].x,k[2].y-k[5].y);const thumbOpen=thumbReach>thumbFold*1.0;if(f===4&&thumbOpen)return 5;return f;}function emo(n){return({1:'🪱',2:'🐰',3:'🐱',4:'🦋',5:'🦁'})[n]||'';}async function start(){const s=await navigator.mediaDevices.getUserMedia({video:true});v.srcObject=s;await new Promise(r=>v.onloadedmetadata=r);const det=await handPoseDetection.createDetector(handPoseDetection.SupportedModels.MediaPipeHands,{runtime:'tfjs',modelType:'full',maxHands:2});async function loop(){const hands=await det.estimateHands(v,{flipHorizontal:true});ctx.clearRect(0,0,c.width,c.height);for(const h of hands){const p=h.keypoints;let x=0,y=0,r=0;p.forEach(pt=>{x+=pt.x;y+=pt.y});x/=p.length;y/=p.length;p.forEach(pt=>r=Math.max(r,Math.hypot(pt.x-x,pt.y-y)));const e=emo(count(p));if(e){ctx.font=Math.max(100,(r+40)*2)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(e,x,y);}}requestAnimationFrame(loop)}loop()}start();</script></body></html>
